<svg xmlns="http://www.w3.org/2000/svg" width="240" height="42" viewBox="0 0 240 42" fill="none">
  <defs>
    <linearGradient id="web-grad-ja" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="web-shadow-ja" x="-5%" y="-15%" width="110%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284C7" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#web-shadow-ja)">
    <!-- Main pill background -->
    <rect x="1" y="1" width="238" height="40" rx="20" fill="url(#web-grad-ja)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.2" />

    <!-- Website Globe Icon -->
    <g transform="translate(18, 11)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10" />
        <line x1="2" y1="12" x2="22" y2="12" />
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
      </svg>
    </g>

    <!-- Text -->
    <text x="48" y="25" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif" font-size="13.5" font-weight="600" letter-spacing="0.4">公式サイトへアクセス</text>

    <!-- Right Arrow Icon -->
    <g transform="translate(206, 14)">
      <path d="M1 6.5h11M7.5 2l4.5 4.5L7.5 11" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
